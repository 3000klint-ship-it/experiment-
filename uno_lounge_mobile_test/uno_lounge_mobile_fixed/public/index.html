<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UNO Lounge — Test Build</title>
<style>
:root{--bg:#120c10;--felt:#28141d;--gold:#e4c36a;--cream:#fff6e7;--muted:#cbbba0;--red:#d44343;--yellow:#d9b52d;--green:#31955d;--blue:#3d70bd}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 20%,#321824,#0d080b 70%);color:var(--cream);overflow:hidden}
button,input{font:inherit}.hidden{display:none!important}.screen{height:100%;display:grid;place-items:center;padding:18px}.panel{width:min(94vw,520px);max-height:94vh;overflow:auto;background:rgba(20,10,14,.96);border:1px solid var(--gold);border-radius:22px;padding:26px;box-shadow:0 25px 80px #0008}
h1{margin:0;color:var(--gold);letter-spacing:3px}h1 small{display:block;font-size:.4em;color:#bda878;letter-spacing:5px;margin-top:5px}.sub{color:var(--muted);margin:8px 0 22px}
.row{display:flex;gap:10px}.row>*{flex:1}.field{display:block;margin:12px 0;color:var(--muted);font-size:.9rem}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid #735c2a;background:#120b0e;color:#fff}.btn{border:1px solid var(--gold);border-radius:12px;padding:12px 16px;background:transparent;color:var(--cream);cursor:pointer}.btn.gold{background:linear-gradient(#f4df9d,#d7b94f);color:#241807;font-weight:800}.btn:disabled{opacity:.4}
.game-grid{display:grid;grid-template-columns:1fr;gap:12px}.game-card{border:1px solid #6c5427;border-radius:15px;padding:16px;background:#201016}.game-card strong{display:block;color:var(--gold);font-size:1.1rem}.game-card span{font-size:.8rem;color:var(--muted)}
.lobby-list{margin:18px 0;border:1px solid #543f25;border-radius:14px;overflow:hidden}.player{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #38252a}.player:last-child{border:0}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#473147;border:3px solid var(--gold);font-size:1.35rem;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:auto}.player .name{flex:1}.tag{font-size:.72rem;color:#dccb9f}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings label{font-size:.8rem;color:var(--muted)}select{width:100%;margin-top:4px;padding:10px;border-radius:9px;background:#120b0e;color:#fff;border:1px solid #6d562d}
#table{height:100%;position:relative;background:radial-gradient(ellipse at 50% 45%,#6b2030 0%,#32131e 43%,#11090d 100%);overflow:hidden}.table-ring{position:absolute;inset:2%;border:2px solid #8e6e31;border-radius:50%/30%;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}.hostbar{display:flex;gap:6px}.icon{border:1px solid var(--gold);background:#120b0dcc;color:var(--cream);border-radius:10px;padding:8px 10px;cursor:pointer}
.seats{position:absolute;inset:5% 2% 22%}.seat{position:absolute;width:160px;text-align:center}.seat .avatar{margin:auto;width:120px;height:120px;border:3px solid var(--gold);border-radius:50%}.seat .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;image-rendering:auto}.seat .pname{margin-top:3px;font-weight:700;font-size:.85rem}.seat.turn .avatar{box-shadow:0 0 0 3px #fff,0 0 25px #ffe39b}.seat.disconnected{opacity:.35}
.card-count{display:flex;align-items:center;justify-content:center;gap:1px;margin-top:3px;flex-wrap:wrap;max-width:140px}.card-count .mini-card{width:12px;height:17px;border-radius:2px;background:linear-gradient(135deg,#751c2a,#2b0d14);border:1px solid var(--gold);box-shadow:0 1px 3px #0006}
.s1{top:0;left:50%;transform:translateX(-50%)}.s2{top:12%;left:2%}.s3{top:12%;right:2%}.s4{bottom:2%;left:2%}.s5{bottom:2%;right:2%}.s6{bottom:0;left:50%;transform:translateX(-50%)}.s7{top:42%;left:-1%}.s8{top:42%;right:-1%}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:20px}.pile{width:76px;height:108px;border-radius:10px}.back{display:grid;place-items:center;background:linear-gradient(135deg,#751c2a,#2b0d14);border:3px solid var(--gold);font-weight:900;color:#f7d98a;box-shadow:0 8px 20px #0008}.discard{position:relative}.card{width:76px;height:108px;border-radius:10px;border:3px solid #fff;position:relative;display:grid;place-items:center;color:#fff;font-size:1.7rem;font-weight:900;box-shadow:0 8px 20px #0009;user-select:none}.card:before{content:"";position:absolute;inset:10px 4px;border-radius:50%;background:#fff5;transform:rotate(-18deg) scaleX(1.35)}.card>*{position:relative}.red{background:var(--red)}.yellow{background:var(--yellow);color:#382700}.green{background:var(--green)}.blue{background:var(--blue)}.wild{background:conic-gradient(var(--red),var(--yellow),var(--green),var(--blue),var(--red))}
.hand-wrap{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:min(96vw,1000px);text-align:center}.hand{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;max-height:150px}.hand .card{width:68px;height:96px;font-size:1.45rem;cursor:pointer;transition:.15s}.hand .card:hover{transform:translateY(-14px)}.hand .disabled{filter:brightness(.55) grayscale(.5);cursor:not-allowed}.drawbtn{margin-top:7px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;background:#120b0eee;border:1px solid var(--gold);padding:9px 16px;border-radius:20px;color:var(--cream)}
.overlay{position:fixed;inset:0;background:#000b;z-index:80;display:grid;place-items:center}.modal{background:#1b0d12;border:1px solid var(--gold);border-radius:18px;padding:25px;width:min(92vw,420px);text-align:center}.modal h2{color:var(--gold)}
.avatar-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;justify-content:center}
.avatar-grid .av{width:60px;height:60px;border-radius:50%;border:3px solid transparent;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s}
.avatar-grid .av img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.avatar-grid .av.selected{border-color:var(--gold);transform:scale(1.1)}
.avatar-grid .av:hover{border-color:#bda878}

.flying-card{position:fixed;z-index:200;pointer-events:none;width:60px;height:86px;border-radius:8px;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:1.2rem;font-weight:900;box-shadow:0 6px 16px #000a}
.color-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:grid;place-items:center}
.color-picker-box{background:#1b0d12;border:2px solid var(--gold);border-radius:18px;padding:24px;text-align:center}
.color-picker-box h3{color:var(--gold);margin:0 0 16px;font-size:1.1rem}
.color-picker-btns{display:flex;gap:14px;justify-content:center}
.color-picker-btns .cpick{width:64px;height:64px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .12s,border-color .12s}
.color-picker-btns .cpick:hover{transform:scale(1.15);border-color:#fff}
.color-picker-btns .cpick.red{background:var(--red)}
.color-picker-btns .cpick.yellow{background:var(--yellow)}
.color-picker-btns .cpick.green{background:var(--green)}
.color-picker-btns .cpick.blue{background:var(--blue)}

@media(max-width:700px){
  .seat{width:110px;font-size:.78rem}
  .seat .avatar{width:100px;height:100px;border-width:3px}
  .seat .pname{font-size:.72rem}
  .card-count .mini-card{width:11px;height:16px}
  .s1{top:0}.s2{top:14%;left:0}.s3{top:14%;right:0}
  .s4{bottom:4%;left:0}.s5{bottom:4%;right:0}.s6{bottom:0}
  .s7{top:40%;left:-2%}.s8{top:40%;right:-2%}
  .seats{inset:6% 1% 24%}
  .pile,.card{width:60px;height:86px;border-radius:9px}
  .card{font-size:1.35rem}
  .hand-wrap{bottom:max(6px,env(safe-area-inset-bottom));width:100%;padding:0 5px}
  .hand{max-height:132px;gap:2px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;justify-content:flex-start;padding:5px 4px 7px;scrollbar-width:none}
  .hand::-webkit-scrollbar{display:none}
  .hand .card{flex:0 0 55px;width:55px;height:79px;font-size:1.1rem}
  .hand .card:hover{transform:none}
  .hand .card:active{transform:translateY(-8px)}
  .drawbtn{margin-top:2px;min-height:40px;padding:7px 16px}
  .toast{top:max(8px,env(safe-area-inset-top));max-width:90vw;text-align:center}
  .modal{width:calc(100vw - 30px)}
  .avatar-grid .av{width:48px;height:48px}
  .flying-card{width:48px;height:68px;font-size:1rem}
}
</style>
</head>
<body>
<div id="lobby" class="screen">
  <div class="panel">
    <h1>UNO <small>LOUNGE</small></h1>
    <p class="sub">Private multiplayer table · test build</p>
    <div id="home">
      <label class="field">Username<input id="username" maxlength="18" placeholder="Enter your name"></label>
      <div class="field">Choose your character</div>
      <div class="avatar-grid" id="avatarGrid"></div>
      <div class="game-grid">
        <div class="game-card"><strong>🃏 UNO</strong><span>Only game enabled for now</span></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn gold" id="create">Create room</button><button class="btn" id="showJoin">Join room</button></div>
      <div id="joinBox" class="hidden" style="margin-top:12px"><label class="field">Room code<input id="roomCode" maxlength="6" placeholder="ABC123"></label><button class="btn gold" id="join">Join</button></div>
    </div>
    <div id="roomPanel" class="hidden">
      <p>Room <strong id="code"></strong> · share this code with players.</p>
      <div class="settings" id="hostSettings">
        <label>Players<select id="maxPlayers"><option value="6">6 players</option><option value="8">8 players</option></select></label>
        <label>Starting cards<select id="minCards"></select></label>
        <label>Maximum cards<select id="maxCards"></select></label>
      </div>
      <div class="lobby-list" id="players"></div>
      <div class="row"><button class="btn gold" id="start">Start game</button><button class="btn" id="leave">Leave</button></div>
      <p id="hostHint" class="tag" style="margin-top:12px"></p>
    </div>
  </div>
</div>

<div id="table" class="hidden">
  <div class="table-ring"></div>
  <div class="top"><div id="roomLabel" class="tag"></div><div class="hostbar"><button class="icon" id="music">♪</button><button class="icon hidden" id="endGame">End game</button></div></div>
  <div class="seats" id="seats"></div>
  <div class="center"><div class="pile back" id="drawPile">UNO</div><div class="pile discard" id="discard"></div><div id="colorDot"></div></div>
  <div class="hand-wrap"><div class="hand" id="hand"></div><div style="display:flex;justify-content:center;gap:8px;align-items:center"><button class="btn drawbtn" id="drawBtn">Draw</button><button class="btn gold drawbtn" id="unoBtn">UNO!</button></div></div>
</div>

<div id="modal" class="overlay hidden"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="btn gold" id="modalOk">OK</button></div></div>
<div id="colorPicker" class="color-picker-overlay hidden"><div class="color-picker-box"><h3>Choose a color</h3><div class="color-picker-btns"><div class="cpick red" data-color="red"></div><div class="cpick yellow" data-color="yellow"></div><div class="cpick green" data-color="green"></div><div class="cpick blue" data-color="blue"></div></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
var $=function(id){return document.getElementById(id)};
var ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
var myId=null,room=null,game=null,isHost=false,audio=null,musicOn=false;
var selectedAvatar="avatar1.jpg";

var avatarFiles=["avatar1.jpg","avatar2.jpg","avatar3.jpg","avatar4.jpg","avatar5.jpg","avatar6.jpg","avatar7.jpg","avatar8.jpg","avatar9.jpg","avatar10.jpg","avatar11.jpg","avatar12.jpg","avatar13.jpg"];
var grid=$("avatarGrid");
avatarFiles.forEach(function(f){
  var d=document.createElement("div");d.className="av";if(f===selectedAvatar)d.classList.add("selected");
  d.innerHTML="<img src=\""+f+"\" alt=\"avatar\">";
  d.onclick=function(){grid.querySelectorAll(".av").forEach(function(a){a.classList.remove("selected")});d.classList.add("selected");selectedAvatar=f;};
  grid.appendChild(d);
});

for(var i=10;i<=30;i++){$("minCards").insertAdjacentHTML("beforeend","<option value=\""+i+"\">"+i+"</option>");$("maxCards").insertAdjacentHTML("beforeend","<option value=\""+i+"\">"+i+"</option>");}
$("maxCards").value=30;

function send(type,data){if(!data)data={};if(ws.readyState===1)ws.send(JSON.stringify(Object.assign({type:type},data)))}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");clearTimeout(window._tt);window._tt=setTimeout(function(){$("toast").classList.add("hidden")},2200)}
function avatar(p){
  if(!p||!p.avatar)return "<span style=\"font-size:1.5rem\">🙂</span>";
  return "<img src=\""+p.avatar+"\" alt=\"avatar\">";
}
function cardLabel(c){return c.type==="number"?c.value:c.type==="skip"?"⊘":c.type==="reverse"?"⟲":c.type==="draw2"?"+2":c.type==="wild"?"★":"+4"}
function cardEl(c,click,disabled){
  var d=document.createElement("div");d.className="card "+c.color+(disabled?" disabled":"");d.innerHTML="<span>"+cardLabel(c)+"</span>";
  if(click)d.onclick=function(){play(c)};return d;
}

function cardCountHTML(count){
  var html="<div class=\"card-count\">";
  for(var i=0;i<count;i++) html+="<div class=\"mini-card\"></div>";
  html+="</div>";return html;
}

function renderRoom(){
  $("lobby").classList.remove("hidden");$("roomPanel").classList.remove("hidden");$("home").classList.add("hidden");
  $("code").textContent=room.code;$("maxPlayers").value=room.maxPlayers;$("minCards").value=room.minCards;$("maxCards").value=room.maxCards;
  isHost=room.hostId===myId;$("hostSettings").style.display=isHost?"grid":"none";$("start").classList.toggle("hidden",!isHost);
  $("hostHint").textContent=isHost?"You have host access.":"Waiting for the host to start the game.";
  var box=$("players");box.innerHTML="";
  room.players.forEach(function(p){var d=document.createElement("div");d.className="player";d.innerHTML="<div class=\"avatar\">"+avatar(p)+"</div><div class=\"name\">"+p.username+"<div class=\"tag\">"+(p.host?"HOST · ":"")+(p.connected?"Online":"Disconnected")+"</div></div>";box.appendChild(d)});
}

function flyCard(fromX,fromY,toX,toY,color,label,duration){
  var fc=document.createElement("div");
  fc.className="flying-card "+color;
  fc.innerHTML="<span>"+label+"</span>";
  fc.style.left=fromX+"px";fc.style.top=fromY+"px";
  document.body.appendChild(fc);
  var start=performance.now();
  function step(now){
    var t=Math.min((now-start)/duration,1);
    var ease=t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    fc.style.left=(fromX+(toX-fromX)*ease)+"px";
    fc.style.top=(fromY+(toY-fromY)*ease)+"px";
    fc.style.transform="scale("+(1-ease*0.6)+") rotate("+(ease*15)+"deg)";
    fc.style.opacity=1-ease*0.3;
    if(t<1)requestAnimationFrame(step);else fc.remove();
  }
  requestAnimationFrame(step);
}

function getSeatCenter(seatIndex){
  var seatEl=document.querySelector(".seat.s"+(seatIndex+1));
  if(!seatEl)return{x:window.innerWidth/2,y:window.innerHeight/2};
  var r=seatEl.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}
function getDiscardCenter(){
  var el=$("discard");
  if(!el)return{x:window.innerWidth/2,y:window.innerHeight/2};
  var r=el.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}
function getDrawPileCenter(){
  var el=$("drawPile");
  if(!el)return{x:window.innerWidth/2,y:window.innerHeight/2};
  var r=el.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}

function renderGame(){
  $("lobby").classList.add("hidden");$("table").classList.remove("hidden");
  isHost=room.hostId===myId;$("endGame").classList.toggle("hidden",!isHost);
  $("roomLabel").textContent="UNO · "+room.code+" · "+room.players.length+"/"+room.maxPlayers;
  var seats=$("seats");seats.innerHTML="";
  var classes=["s1","s2","s3","s4","s5","s6","s7","s8"];
  game.players.forEach(function(p){
    var d=document.createElement("div");
    d.className="seat "+classes[p.seat]+" "+(p.seat===game.turn?"turn":"")+(p.connected?"":" disconnected");
    d.innerHTML="<div class=\"avatar\">"+avatar(p)+"</div>"
      +"<div class=\"pname\">"+p.username+(p.id===myId?" (You)":"")+"</div>"
      +cardCountHTML(p.handCount)
      +(p.calledUno?"<div style=\"color:var(--gold);font-weight:900;font-size:1rem;margin-top:2px\">UNO!</div>":"");
    seats.appendChild(d);
  });
  var disc=$("discard");disc.innerHTML="";disc.appendChild(cardEl(game.discard,false,false));
  $("hand").innerHTML="";var me=game.players.find(function(p){return p.id===myId});var myTurn=game.turn===me?.seat&&!game.winner;
  game.hand.forEach(function(c){$("hand").appendChild(cardEl(c,true,!(myTurn&&playable(c))))});
  if(game.winner){showModal("Winner!",game.players.find(function(p){return p.id===game.winner})?.username+" won the game.");}
}

function playable(c){
  var top=game.discard;
  if(c.color==="wild")return game.drawStack>0?c.type==="wild4":true;
  if(game.drawStack>0)return top.type==="draw2"&&c.type==="draw2";
  if(c.color===game.currentColor)return true;
  if(top.type==="number"&&c.type==="number"&&c.value===top.value)return true;
  return top.type!=="number"&&c.type===top.type;
}
function play(c){
  if(!playable(c)||game.turn!==game.players.find(function(p){return p.id===myId})?.seat)return;
  if(c.color==="wild"){
    pendingWildCard=c;
    $("colorPicker").classList.remove("hidden");
  }else send("play",{cardId:c.id,color:c.color});
}
var pendingWildCard=null;
document.querySelectorAll(".cpick").forEach(function(btn){
  btn.onclick=function(){
    var color=btn.getAttribute("data-color");
    $("colorPicker").classList.add("hidden");
    if(pendingWildCard){send("play",{cardId:pendingWildCard.id,color:color});pendingWildCard=null;}
  };
});
function showModal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").classList.remove("hidden")}
$("modalOk").onclick=function(){$("modal").classList.add("hidden")};

ws.onmessage=function(e){var m=JSON.parse(e.data);
  if(m.type==="hello")myId=m.id;
  if(m.type==="created"||m.type==="joined"){toast("Room "+m.code);$("code").textContent=m.code}
  if(m.type==="soloCreated"){toast("Room "+m.code);$("code").textContent=m.code}
  if(m.type==="room"){room=m.room;renderRoom()}
  if(m.type==="state"){
    room=m.room;
    var oldPlayers=game?JSON.parse(JSON.stringify(game.players)):null;
    game=m.game;
    if(game){
      renderGame();
      if(oldPlayers){
        var drawPile=getDrawPileCenter();
        var center=getDiscardCenter();
        for(var i=0;i<game.players.length;i++){
          var np=game.players[i];
          var op=null;
          for(var j=0;j<oldPlayers.length;j++){if(oldPlayers[j].id===np.id){op=oldPlayers[j];break;}}
          if(!op)continue;
          var seat=getSeatCenter(np.seat);
          if(np.handCount>op.handCount){
            var diff=np.handCount-op.handCount;
            for(var d=0;d<diff;d++){
              (function(dd,seatPos){
                setTimeout(function(){flyCard(drawPile.x,drawPile.y,seatPos.x,seatPos.y,"red","",500);},dd*120);
              })(d,{x:seat.x,y:seat.y});
            }
          }
          if(np.handCount<op.handCount){
            var diff2=op.handCount-np.handCount;
            for(var d2=0;d2<diff2;d2++){
              (function(dd,seatPos){
                setTimeout(function(){flyCard(seatPos.x,seatPos.y,center.x,center.y,"wild","",450);},dd*120);
              })(d2,{x:seat.x,y:seat.y});
            }
          }
        }
      }
    }else renderRoom();
  }
  if(m.type==="error")toast(m.message);
  if(m.type==="hostChanged"){toast(m.username+" now has host access.");if(room){room.hostId=m.hostId;renderRoom()}}
  if(m.type==="winner")toast(m.username+" won!");
  if(m.type==="gameEnded"){showModal("Game ended",m.winner?"The game finished.":"The host ended the game.");$("table").classList.add("hidden");$("lobby").classList.remove("hidden")}
  if(m.type==="started"){toast("Game started!");}
  if(m.type==="sound")playSound(m.name);
};

$("create").onclick=function(){var u=$("username").value.trim();if(!u)return toast("Enter a username.");send("create",{username:u,avatar:selectedAvatar})};
$("showJoin").onclick=function(){$("joinBox").classList.toggle("hidden")};
$("join").onclick=function(){var u=$("username").value.trim(),c=$("roomCode").value.trim();if(!u||!c)return toast("Enter username and room code.");send("join",{username:u,code:c,avatar:selectedAvatar})};
$("maxPlayers").onchange=function(){isHost&&send("setSettings",{maxPlayers:+$("maxPlayers").value,minCards:+$("minCards").value,maxCards:+$("maxCards").value})};
$("minCards").onchange=$("maxCards").onchange=function(){isHost&&send("setSettings",{maxPlayers:+$("maxPlayers").value,minCards:+$("minCards").value,maxCards:+$("maxCards").value})};
$("start").onclick=function(){send("start")};
$("endGame").onclick=function(){if(confirm("End this game?"))send("end")};
$("drawPile").onclick=function(){send("draw")};$("drawBtn").onclick=function(){send("draw")};
$("unoBtn").onclick=function(){send("uno")};
$("leave").onclick=function(){location.reload()};

function playSound(name){
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  var o=audio.createOscillator(),g=audio.createGain();o.connect(g).connect(audio.destination);
  var f=name==="uno"?880:name==="draw"?330:560;o.frequency.value=f;o.type=name==="card"?"triangle":"sine";g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.15);
 }catch(e){}
}
$("music").onclick=function(){musicOn=!musicOn;$("music").textContent=musicOn?"♫":"♪";if(musicOn){playSound("card");toast("Simple ambient tune enabled.");}else toast("Sound off.")};
</script>
